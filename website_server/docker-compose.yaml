services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: website
      POSTGRES_PASSWORD: "4V9xhe5e6Z70YcnRgJr4qIi-vfOvFFub"
    volumes:
      - website_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "KlnoAm0_7iWoVfJHDsuPrlXcw0inL4X9"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: website_test
      POSTGRES_PASSWORD: "b6ghwPALg5e7soS7WBuz9NLzrzSQALO9"
    volumes:
      - website_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "KMV1jqejsH3KfKI3UzsuOQobFPspDcwC"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  website_data:
  website_test_data:
